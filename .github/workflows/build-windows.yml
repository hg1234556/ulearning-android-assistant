name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ULearningAssistant --add-data "profiles;profiles" --add-data "ulearning_assistant/assets;ulearning_assistant/assets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ULearningAssistant-Windows
          path: dist/ULearningAssistant.exe
          if-no-files-found: error
